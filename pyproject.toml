[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "KpPhageClassifier"
dynamic = ["version"]
description = "Reference-relative Klebsiella phage classification using whole-proteome wGRR and gene-order comparison"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23", "pandas>=1.5", "biopython>=1.81"]
keywords = ["Klebsiella", "phage", "wGRR", "genomics", "gene order"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
dna = ["pyrodigal-gv==0.3.2", "pyrodigal==3.7.1"]
dev = ["build>=1.2", "twine>=6", "ruff>=0.8"]

[project.scripts]
kp-phage = "kp_phage_classifier.cli:main"

[project.urls]
"Repository" = "https://github.com/RaymondLiu1124/KpPhageClassifier"
"Issues" = "https://github.com/RaymondLiu1124/KpPhageClassifier/issues"
"Reference library" = "https://doi.org/10.6084/m9.figshare.35048395.v2"

[tool.setuptools.dynamic]
version = {attr = "kp_phage_classifier.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kp_phage_classifier*"]

[tool.setuptools.package-data]
kp_phage_classifier = ["reference_releases.json"]

[tool.ruff.lint]
select = ["F", "E9"]
